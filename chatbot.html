<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAULT — AI Chat</title>

<style>
:root{
 --red:#e8271e;
 --bg:#070707;
 --surface:#101010;
 --border:#252525;
 --text:#f2efe9;
 --muted:#888;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
 font-family:Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
 height:100vh;
 display:flex;
 flex-direction:column;
}

header{
 padding:20px 30px;
 border-bottom:1px solid var(--border);
 display:flex;
 justify-content:space-between;
}

.logo{
 font-size:25px;
 font-weight:bold;
 letter-spacing:5px;
}

.logo span{color:var(--red)}

.top-links a{
 color:var(--muted);
 text-decoration:none;
 margin-left:15px;
}

.main{
 flex:1;
 display:flex;
 flex-direction:column;
 min-height:0;
}

.hero{
 padding:25px;
 border-bottom:1px solid var(--border);
}

.hero h1{
 font-size:32px;
 margin-bottom:6px;
}

.hero p{color:var(--muted)}

.chat-box{
 flex:1;
 overflow-y:auto;
 padding:20px;
 display:flex;
 flex-direction:column;
 gap:12px;
}

.message{
 max-width:75%;
 padding:13px 16px;
 border-radius:15px;
 white-space:pre-wrap;
}

.user{
 align-self:flex-end;
 background:var(--red);
}

.ai{
 align-self:flex-start;
 background:var(--surface);
 border:1px solid var(--border);
}

.input-area{
 display:flex;
 padding:15px;
 border-top:1px solid var(--border);
}

input{
 flex:1;
 padding:13px;
 border-radius:20px;
 border:1px solid var(--border);
 background:var(--surface);
 color:white;
 outline:none;
}

button{
 margin-left:10px;
 padding:13px 20px;
 border:0;
 border-radius:20px;
 background:var(--red);
 color:white;
 cursor:pointer;
}

button:hover{opacity:.85}
</style>
</head>

<body>

<header>
 <div class="logo">V<span>A</span>ULT</div>

 <div class="top-links">
  <a href="boom.html">Home</a>
  <a href="upload.html">Your movies</a>
 </div>
</header>

<div class="main">

 <div class="hero">
  <h1>AI Assistant</h1>
  <p>Ask about movies, games, VAULT and George's Universe.</p>
 </div>

 <div class="chat-box" id="chatBox"></div>

 <div class="input-area">
  <input id="userInput" placeholder="Ask VAULT AI...">
  <button onclick="sendMessage()">Send</button>
 </div>

</div>

<script>

let userName=localStorage.getItem("vaultUserName")||"";

const knowledge={

 "movies":
 "VAULT currently has three movies: The Final Night, The Zombie Escape, and Galaxy Mission.",

 "the zombie escape":
 "The Zombie Escape is a fan-made survival movie created by the Movie Hub community. It follows a group of friends trying to survive a zombie outbreak in their city.",

 "the final night":
 "The Final Night is about a strange night when nothing is normal anymore. Survivors must figure out what is happening before sunrise.",

 "galaxy mission":
 "Galaxy Mission follows a crew of astronauts sent beyond known space. Something goes wrong, and they must survive unknown forces, limited oxygen, and a failing ship.",

 "vault":
 "VAULT is a computer-focused group in the George's Universe community.",

 "darkgamers":
 "DarkGamers is a different group from VAULT that works with computers and helps the Movie Hub community.",

 "george's universe":
 "George's Universe is a creative online community featuring movies, games, projects, VAULT and DarkGamers.",

 "games":
 "George's Universe has games and other interactive projects created for the community."
};

function addMessage(text,type){

 const box=document.getElementById("chatBox");

 const message=document.createElement("div");

 message.className="message "+type;

 message.textContent=text;

 box.appendChild(message);

 box.scrollTop=box.scrollHeight;
}

function answer(question){

 let q=question.toLowerCase();

 /* NAME */
 if(q.includes("my name is ")){

  let name=question
   .split(/my name is /i)[1]
   .trim();

  userName=name;

  localStorage.setItem("vaultUserName",name);

  return "Got it! I'll call you "+name+" from now on! 🎬";
 }

 if(q.includes("call me ")){

  let name=question
   .split(/call me /i)[1]
   .trim();

  userName=name;

  localStorage.setItem("vaultUserName",name);

  return "Got it! I'll call you "+name+" from now on! 🎬";
 }

 /* SEARCH KNOWLEDGE */

 for(let key in knowledge){

  if(q.includes(key)){
   return knowledge[key];
  }

 }

 /* EXTRA QUESTIONS */

 if(q.includes("hello")||q.includes("hi")){
  return userName
   ? "Hey "+userName+"! 👋 What would you like to know about VAULT?"
   : "Hey! 👋 What would you like to know about VAULT?";
 }

 if(q.includes("who are you")){
  return "I'm VAULT AI, the information assistant for the George's Universe community.";
 }

 if(q.includes("what can you do")){
  return "I can answer questions about George's Universe, VAULT, DarkGamers, movies and games.";
 }

 return "I don't know that yet. Try asking me about movies, The Zombie Escape, The Final Night, Galaxy Mission, VAULT, DarkGamers, games, or George's Universe.";
}

function sendMessage(){

 const input=document.getElementById("userInput");

 const text=input.value.trim();

 if(!text)return;

 addMessage(text,"user");

 input.value="";

 setTimeout(()=>{

  addMessage(answer(text),"ai");

 },300);
}

document.getElementById("userInput").addEventListener(
 "keydown",
 function(e){
  if(e.key==="Enter")sendMessage();
 }
);

addMessage(
 userName
 ? "Welcome back, "+userName+"! 🎬"
 : "Welcome to VAULT AI! Ask me about George's Universe.",
 "ai"
);

</script>

</body>
</html>
