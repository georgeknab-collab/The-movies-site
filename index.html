<!DOCTYPE html>
<html>
<head>
<title>Admin</title>
</head>
<body>

<h1>ADMIN LOGIN</h1>
<p>Enter the 4 digit code:</p>

<input id="code" maxlength="4">
<button onclick="login()">LOGIN</button>

<p id="result"></p>

<script>
let code = "7392";

function login(){
  let guess = document.getElementById("code").value;

  if(guess == code){
    window.location.href = "boom.html";
  }else{
    document.getElementById("result").innerHTML =
    "ACCESS DENIED";
  }
}
</script>

</body>
</html>
