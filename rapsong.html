<!DOCTYPE html>
<html>
<head>
    <title>🔥 Changing Rap Beat 🔥</title>

    <script src="https://unpkg.com/tone"></script>

    <style>

        body {
            margin: 0;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            margin: 50px auto;
            max-width: 800px;
            padding: 40px;
            background: #111;
            border-radius: 20px;
            border: 1px solid #222;
            box-shadow: 0 0 50px rgba(255,49,49,0.12);
        }

        h1 {
            font-size: 45px;
            margin-bottom: 30px;
            color: #ff3131;
            text-shadow:
                0 0 10px #ff3131,
                0 0 30px rgba(255,49,49,0.5);
        }

        button {
            padding: 18px 35px;
            margin: 10px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.06);
        }

        #play {
            background: limegreen;
            color: white;
        }

        #stop {
            background: crimson;
            color: white;
        }

        #section {
            font-size: 26px;
            margin-top: 25px;
            min-height: 40px;

            color: #ff3131;

            font-weight: bold;
            letter-spacing: 2px;

            text-shadow:
                0 0 10px #ff3131,
                0 0 25px rgba(255,49,49,0.7);

            transition: 0.3s;
        }

        .finished {
            animation: finishedGlow 1s infinite alternate;
        }

        @keyframes finishedGlow {

            from {
                transform: scale(1);

                text-shadow:
                    0 0 10px #ff3131;
            }

            to {
                transform: scale(1.08);

                text-shadow:
                    0 0 15px #ff3131,
                    0 0 40px #ff3131;
            }

        }

    </style>
</head>


<body>

<div class="box">

    <h1>🔥 GEORGE'S RAP BEAT 🔥</h1>

    <button id="play">
        ▶ PLAY
    </button>

    <button id="stop">
        ⏹ STOP
    </button>

    <div id="section">
        READY...
    </div>

</div>


<script>

// ======================================================
// INSTRUMENTS
// ======================================================

const kick = new Tone.MembraneSynth({

    pitchDecay: 0.02,

    octaves: 8,

    envelope: {
        attack: 0.001,
        decay: 0.2,
        sustain: 0,
        release: 0.08
    }

}).toDestination();


const snare = new Tone.NoiseSynth({

    noise: {
        type: "pink"
    },

    envelope: {
        attack: 0.001,
        decay: 0.12,
        sustain: 0
    }

}).toDestination();


const hat = new Tone.MetalSynth({

    frequency: 300,

    envelope: {
        attack: 0.001,
        decay: 0.04,
        release: 0.01
    },

    harmonicity: 5,

    modulationIndex: 40

}).toDestination();


const bass = new Tone.MonoSynth({

    oscillator: {
        type: "fatsawtooth"
    },

    envelope: {
        attack: 0.005,
        decay: 0.15,
        sustain: 0.6,
        release: 0.1
    },

    filterEnvelope: {
        attack: 0.005,
        decay: 0.1,
        sustain: 0.8,
        release: 0.2,
        baseFrequency: 60,
        octaves: 3
    }

}).toDestination();


const lead = new Tone.PolySynth(Tone.Synth, {

    oscillator: {
        type: "fatsawtooth"
    },

    envelope: {
        attack: 0.005,
        decay: 0.1,
        sustain: 0.5,
        release: 0.2
    }

}).toDestination();


const sub = new Tone.MembraneSynth({

    pitchDecay: 0.01,

    octaves: 5,

    envelope: {
        attack: 0.001,
        decay: 0.4,
        sustain: 0,
        release: 0.1
    }

}).toDestination();


// ======================================================
// SECTION VARIABLES
// ======================================================

let section = 0;
let bar = 0;
let playing = false;


// ======================================================
// DRUMS
// ======================================================

const drums = new Tone.Sequence(

    (time, step) => {

        // INTRO
        if (section === 0) {

            if (step === 0) {

                kick.triggerAttackRelease(
                    "C1",
                    "8n",
                    time
                );

            }

            if (step % 2 === 0) {

                hat.triggerAttackRelease(
                    "32n",
                    time
                );

            }

            return;
        }


        // VERSE
        if (section === 1) {

            if (
                step === 0 ||
                step === 3 ||
                step === 4
            ) {

                kick.triggerAttackRelease(
                    "C1",
                    "8n",
                    time
                );

            }

            if (
                step === 2 ||
                step === 6
            ) {

                snare.triggerAttackRelease(
                    "16n",
                    time
                );

            }

            hat.triggerAttackRelease(
                "32n",
                time
            );

            return;
        }


        // BUILD
        if (section === 2) {

            if (
                step === 0 ||
                step === 2 ||
                step === 4 ||
                step === 6
            ) {

                kick.triggerAttackRelease(
                    "C1",
                    "8n",
                    time
                );

            }

            if (
                step === 2 ||
                step === 6
            ) {

                snare.triggerAttackRelease(
                    "16n",
                    time
                );

            }

            hat.triggerAttackRelease(
                "16n",
                time
            );

            return;
        }


        // DROP / CHORUS
        if (
            section === 3 ||
            section === 4
        ) {

            if (
                step === 0 ||
                step === 2 ||
                step === 3 ||
                step === 4 ||
                step === 5 ||
                step === 7
            ) {

                kick.triggerAttackRelease(
                    "C1",
                    "8n",
                    time
                );

            }

            if (
                step === 2 ||
                step === 6
            ) {

                snare.triggerAttackRelease(
                    "16n",
                    time
                );

            }

            hat.triggerAttackRelease(
                "32n",
                time
            );

            return;
        }


        // BREAK
        if (section === 5) {

            if (
                step === 0 ||
                step === 4
            ) {

                kick.triggerAttackRelease(
                    "C1",
                    "8n",
                    time
                );

            }

            return;
        }


        // FINAL DROP
        if (section === 6) {

            if (
                step === 0 ||
                step === 1 ||
                step === 3 ||
                step === 4 ||
                step === 6 ||
                step === 7
            ) {

                kick.triggerAttackRelease(
                    "C1",
                    "8n",
                    time
                );

            }

            if (
                step === 2 ||
                step === 6
            ) {

                snare.triggerAttackRelease(
                    "16n",
                    time
                );

            }

            hat.triggerAttackRelease(
                "32n",
                time
            );

        }

    },

    [0,1,2,3,4,5,6,7],

    "8n"

);


// ======================================================
// BASS
// ======================================================

const bassLine = new Tone.Sequence(

    (time, step) => {

        let notes;


        if (section === 0) {

            notes = [
                "C1", null, null, null,
                "C1", null, null, null
            ];

        }

        else if (section === 1) {

            notes = [
                "C1", null, "C1", "Eb1",
                "F1", null, "G1", "Eb1"
            ];

        }

        else if (section === 2) {

            notes = [
                "C1", "C1", "Eb1", "F1",
                "G1", "F1", "Eb1", "C1"
            ];

        }

        else if (section === 3) {

            notes = [
                "C1", "C1", "Eb1", "C1",
                "F1", "F1", "G1", "Eb1"
            ];

        }

        else if (section === 4) {

            notes = [
                "C1", "Eb1", "G1", "Bb1",
                "G1", "Eb1", "C1", "G1"
            ];

        }

        else if (section === 5) {

            notes = [
                "C1", null, null, null,
                "Eb1", null, null, null
            ];

        }

        else {

            notes = [
                "C1", "C1", "G1", "Eb1",
                "F1", "F1", "G1", "C2"
            ];

        }


        const note = notes[step];


        if (note) {

            bass.triggerAttackRelease(
                note,
                "8n",
                time
            );

        }

    },

    [0,1,2,3,4,5,6,7],

    "8n"

);


// ======================================================
// MELODY
// ======================================================

const melody = new Tone.Sequence(

    (time, step) => {

        let notes;


        if (section === 0) {

            notes = [
                "C4", null, null, null,
                "Eb4", null, null, null
            ];

        }

        else if (section === 1) {

            notes = [
                "C4", null, "Eb4", null,
                "G4", "F4", "Eb4", null
            ];

        }

        else if (section === 2) {

            notes = [
                "C4", "Eb4", "F4", "G4",
                "Bb4", "G4", "F4", "Eb4"
            ];

        }

        else if (section === 3) {

            notes = [
                "C5", "Bb4", "G4", "Eb4",
                "C5", "Bb4", "G4", "F4"
            ];

        }

        else if (section === 4) {

            notes = [
                "G4", "Bb4", "C5", "Eb5",
                "C5", "Bb4", "G4", "F4"
            ];

        }

        else if (section === 5) {

            notes = [
                null, null, "C5", null,
                null, null, "Eb5", null
            ];

        }

        else {

            notes = [
                "C5", "C5", "Bb4", "G4",
                "Eb5", "C5", "Bb4", "G4"
            ];

        }


        const note = notes[step];


        if (note) {

            lead.triggerAttackRelease(
                note,
                "16n",
                time
            );

        }

    },

    [0,1,2,3,4,5,6,7],

    "8n"

);


// ======================================================
// SUB BASS
// ======================================================

const subBass = new Tone.Sequence(

    (time, step) => {

        if (
            section === 3 ||
            section === 4 ||
            section === 6
        ) {

            const notes = [
                "C1", null, "C1", null,
                "Eb1", null, "G1", null
            ];


            const note = notes[step];


            if (note) {

                sub.triggerAttackRelease(
                    note,
                    "8n",
                    time
                );

            }

        }

    },

    [0,1,2,3,4,5,6,7],

    "8n"

);


// ======================================================
// SECTION CHANGER
// ======================================================

const sectionChanger = new Tone.Loop(

    (time) => {

        bar++;


        // Every 8 bars
        if (bar >= 8) {

            bar = 0;

            section++;


            const names = [

                "🎬 INTRO",

                "🔥 VERSE",

                "⚡ BUILD",

                "💥 DROP",

                "🔥 CHORUS",

                "🌑 BREAK",

                "💀 FINAL DROP"

            ];


            // ==========================================
            // SONG FINISHED
            // ==========================================

            if (section >= 7) {

                section = 6;

                Tone.Transport.stop();

                playing = false;


                drums.stop();
                bassLine.stop();
                melody.stop();
                subBass.stop();
                sectionChanger.stop();


                kick.releaseAll();
                bass.releaseAll();
                lead.releaseAll();
                sub.releaseAll();


                const display =
                    document.getElementById("section");


                display.textContent =
                    "⬅️ PRESS THE BACK ARROW TO GO BACK";


                display.classList.add("finished");


                return;

            }


            document.getElementById("section").textContent =
                names[section];

        }

    },

    "1m"

);


// ======================================================
// PLAY
// ======================================================

document.getElementById("play").onclick =
    async () => {

        if (playing) return;


        playing = true;


        await Tone.start();


        Tone.Transport.bpm.value = 145;


        section = 0;
        bar = 0;


        const display =
            document.getElementById("section");


        display.classList.remove("finished");


        drums.start(0);
        bassLine.start(0);
        melody.start(0);
        subBass.start(0);

        sectionChanger.start(0);


        Tone.Transport.start();


        display.textContent =
            "🎬 INTRO";

    };


// ======================================================
// STOP
// ======================================================

document.getElementById("stop").onclick =
    () => {

        playing = false;


        Tone.Transport.stop();


        drums.stop();
        bassLine.stop();
        melody.stop();
        subBass.stop();
        sectionChanger.stop();


        kick.releaseAll();
        bass.releaseAll();
        lead.releaseAll();
        sub.releaseAll();


        bar = 0;
        section = 0;


        const display =
            document.getElementById("section");


        display.classList.remove("finished");


        display.textContent =
            "READY...";

    };

</script>

</body>
</html>
